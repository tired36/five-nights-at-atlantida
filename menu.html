<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>Five Nights at Atlantida</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      overflow: hidden;
      background: black;
      font-family: monospace;
      color: white;
    }

    #fondo-glitch,
    #fondo-normal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* fondo-glitch va detras del normal. ocultar el normal = mostrar el gif */
    #fondo-normal {
      z-index: 2;
    }

    #fondo-glitch {
      z-index: 1;
    }

    #overlay {
      position: fixed;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      z-index: 3;
    }

    #menu {
      position: absolute;
      top: 30%;
      left: 5%;
      z-index: 4;
    }

    #menu h1 {
      font-size: 50px;
      margin-bottom: 20px;
    }

    #menu button {
      display: block;
      background: transparent;
      border: none;
      color: white;
      font-size: 24px;
      margin: 10px 0;
      cursor: pointer;
    }

    #menu button:hover {
      color: red;
    }

    #panel-noches {
      display: none;
      position: absolute;
      top: 30%;
      left: 5%;
      z-index: 5;
      text-align: center;
      background: rgba(10, 0, 0, 0.85);
      border: 2px solid white;
      padding: 40px;
      min-width: 400px;
    }

    #panel-noches h2 {
      font-size: 35px;
      margin-bottom: 30px;
      letter-spacing: 2px;
    }

    .boton-noche {
      display: block;
      width: 100%;
      background: transparent;
      border: 1px solid white;
      color: white;
      font-size: 24px;
      margin: 15px 0;
      padding: 10px;
      cursor: pointer;
      font-family: monospace;
      transition: all 0.3s;
    }

    .boton-noche:hover:not(:disabled) {
      background: #ff0000;
      color: black;
      font-weight: bold;
    }

    .boton-noche:disabled {
      color: #666;
      border-color: #333;
      cursor: not-allowed;
    }

    .btn-volver {
      margin-top: 30px;
      font-size: 18px;
      border: none;
      background: none;
      color: #aaa;
      cursor: pointer;
      font-family: monospace;
    }

    .btn-volver:hover {
      color: white;
      text-decoration: underline;
    }

    #panel-logros {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #000;
      z-index: 20;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
      padding: 20px 16px 16px;
      box-sizing: border-box;
      overflow: hidden;
      font-family: monospace;
      user-select: none;
    }

    .logros-titulo {
      color: #cc0000;
      font-size: 2.5rem;
      text-transform: uppercase;
      letter-spacing: 5px;
      text-shadow: 2px 2px 20px #ff0000;
      margin: 0 0 16px;
      flex-shrink: 0;
    }

    .logros-contenedor {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 900px;
      flex: 1 1 auto;
      min-height: 0;
      overflow: hidden;
    }

    .logros-lista {
      list-style: none;
      padding: 0;
      margin: 0;
      width: 100%;
      max-width: 700px;
      flex: 1 1 auto;
      min-height: 160px;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
    }

    .logro-item {
      display: flex;
      align-items: center;
      gap: 20px;
      font-size: 1.2rem;
      text-transform: uppercase;
      letter-spacing: 3px;
      padding: 18px 24px;
      margin: 12px 0;
      border: 1px solid #330000;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
    }

    .logro-item:hover {
      background: rgba(40, 0, 0, 0.35);
    }

    .logro-item.seleccionado {
      border-color: #cc0000;
      box-shadow: 0 0 12px rgba(255, 0, 0, 0.25);
    }

    .logro-icono {
      width: 52px;
      height: 52px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #333;
      background: rgba(20, 0, 0, 0.5);
      position: relative;
    }

    .logro-icono svg {
      width: 26px;
      height: 26px;
      fill: currentColor;
    }

    .logro-texto {
      flex: 1;
      text-align: left;
    }

    .logro-item.desbloqueado .logro-icono {
      color: #cc0000;
      border-color: #cc0000;
      box-shadow: 0 0 12px rgba(255, 0, 0, 0.35);
    }

    .logro-item.desbloqueado .logro-texto {
      color: #cc0000;
      text-shadow: 2px 2px 20px #ff0000;
    }

    .logro-item.desbloqueado {
      border-color: #cc0000;
    }

    .logro-item.bloqueado .logro-icono {
      color: #444;
      border-color: #2a2a2a;
    }

    .logro-item.bloqueado .logro-texto {
      color: #333;
      text-shadow: none;
    }

    .logro-item.bloqueado {
      border-color: #222;
    }

    #logro-detalle {
      width: 100%;
      max-width: 700px;
      flex-shrink: 0;
      min-height: 100px;
      max-height: min(32vh, 280px);
      margin: 0 0 12px;
      padding: 20px 24px;
      border: 1px solid #440000;
      background: rgba(15, 0, 0, 0.85);
      text-align: left;
      text-transform: none;
      letter-spacing: 0;
      overflow-y: auto;
      box-sizing: border-box;
    }

    #logro-detalle.logro-detalle--vacio {
      border-color: #330000;
      display: flex;
      align-items: center;
      justify-content: center;
      max-height: 100px;
    }

    #logro-detalle.logro-detalle--activo {
      border-color: #660000;
    }

    .logro-detalle-placeholder {
      color: #666;
      font-size: 0.95rem;
      line-height: 1.5;
      margin: 0;
      text-align: center;
      font-style: italic;
    }

    .logro-detalle-titulo {
      color: #eee;
      font-size: 1.5rem;
      margin: 12px 0;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .logro-detalle-como {
      color: #ccc;
      font-size: 0.95rem;
      line-height: 1.5;
      margin: 0 0 12px;
    }

    .logro-detalle-como strong {
      color: #f88;
    }

    .logro-detalle-desc {
      color: #999;
      font-size: 0.9rem;
      line-height: 1.45;
      margin: 0;
      font-style: italic;
    }

    .logro-dificultad {
      display: inline-block;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      padding: 4px 10px;
      border: 1px solid;
    }

    .logro-dificultad--facil {
      color: #6c6;
      border-color: #6c6;
    }

    .logro-dificultad--media {
      color: #cc6;
      border-color: #cc6;
    }

    .logro-dificultad--dificil {
      color: #f84;
      border-color: #f84;
    }

    .logro-dificultad--extrema {
      color: #f44;
      border-color: #f44;
      text-shadow: 0 0 8px rgba(255, 0, 0, 0.5);
    }

    .btn-volver-logros {
      background: transparent;
      border: none;
      color: #666;
      font-family: monospace;
      font-size: 1rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      cursor: pointer;
      transition: color 0.3s;
      flex-shrink: 0;
    }

    .btn-volver-logros:hover {
      color: #cc0000;
      text-shadow: 0 0 10px #ff0000;
    }

  </style>
</head>

<body>

  <img src="assets/imagenes/menu/glitch.gif" id="fondo-glitch">
  <img src="assets/imagenes/menu/menu_german.png" id="fondo-normal">

  <div id="overlay"></div>

  <div id="menu">
    <h1>Five Nights at Atlantida</h1>
    <button onclick="nuevaPartida()">&#9658; NUEVA PARTIDA</button>
    <button onclick="location.href='ranking.html'">RANKING</button>
    <button onclick="mostrarLogros()">LOGROS</button>
    <button onclick="modoDificil()" style="color:#f55;">MODO DIFICIL</button>
  </div>

  <div id="panel-logros">
    <h2 class="logros-titulo">Logros</h2>
    <div class="logros-contenedor">
      <div id="logro-detalle"></div>
      <ul class="logros-lista" id="logros-lista"></ul>
    </div>
    <p style="color:#666;font-size:12px;margin:8px 0 12px;letter-spacing:1px;flex-shrink:0;">Selecciona un logro de la lista para ver el detalle</p>
    <button type="button" class="btn-volver-logros" onclick="volverMenuLogros()">[ Volver al menu ]</button>
  </div>

  <div id="panel-noches">
    <h2>SELECCIONAR NOCHE</h2>
    <button class="boton-noche" onclick="iniciarNoche(1)">&#9658; NOCHE 1</button>
    <button class="boton-noche" onclick="iniciarNoche(2)">&#9658; NOCHE 2</button>
    <button class="btn-volver" onclick="volverMenu()">[ Volver al menu ]</button>
  </div>

  <div id="panel-dificil" style="display:none;position:absolute;top:30%;left:5%;z-index:5;text-align:center;background:rgba(10,0,0,0.92);border:2px solid #a00;padding:40px;min-width:420px;">
    <h2 style="color:#f44;letter-spacing:2px;margin-bottom:16px;">MODO DIFICIL</h2>
    <p style="color:#ccc;font-size:14px;line-height:1.5;margin-bottom:24px;text-transform:none;letter-spacing:0;">
      Sin cámaras ni audio de retención. Solo puerta y reflejos.<br>
      <span style="color:#f66;">Casi imposible de ganar. Muy difícil.</span>
    </p>
    <button class="boton-noche" onclick="iniciarNocheDificil(1)">&#9658; NOCHE 1D</button>
    <button class="boton-noche" onclick="iniciarNocheDificil(2)">&#9658; NOCHE 2D</button>
    <button class="btn-volver" onclick="volverMenuDificil()">[ Volver al menu ]</button>
  </div>

  <script src="js/fnat-sesion.js"></script>
  <script src="js/logros.js"></script>
  <script>
    var fondoNormal = document.getElementById("fondo-normal");
    var esAlonso = false;

    // glitch rapido: parpadeo corto cada 200ms con 30% de probabilidad
    setInterval(function () {
      if (Math.random() < 0.3) {
        fondoNormal.style.display = "none";
        setTimeout(function () { fondoNormal.style.display = "block"; }, 100);
      }
    }, 200);

    // cada 13 segundos cambia el personaje del fondo aprovechando el glitch
    setInterval(function () {
      fondoNormal.style.display = "none";
      setTimeout(function () {
        fondoNormal.src = esAlonso
          ? "assets/imagenes/menu/menu_german.png"
          : "assets/imagenes/menu/menu_alonso.jpg";
        esAlonso = !esAlonso;
        fondoNormal.style.display = "block";
      }, 150);
    }, 13000);

    function nuevaPartida() {
      FnatSesion.desactivarDificil();
      document.getElementById("menu").style.display = "none";
      document.getElementById("panel-noches").style.display = "block";
    }

    function volverMenu() {
      document.getElementById("panel-noches").style.display = "none";
      document.getElementById("menu").style.display = "block";
    }

    function modoDificil() {
      document.getElementById("menu").style.display = "none";
      document.getElementById("panel-dificil").style.display = "block";
    }

    function volverMenuDificil() {
      document.getElementById("panel-dificil").style.display = "none";
      document.getElementById("menu").style.display = "block";
    }

    function iniciarNocheDificil(num) {
      FnatSesion.activarDificil();
      if (num === 1) FnatSesion.ir("video_intro.html");
      else if (num === 2) FnatSesion.ir("video_intro_noche2.html");
    }

    function mostrarLogros() {
      document.getElementById("menu").style.display = "none";
      document.getElementById("panel-logros").style.display = "flex";
      renderLogros();
    }

    function renderLogros() {
      Logros.renderLista("logros-lista", "logro-detalle");
    }

    function volverMenuLogros() {
      document.getElementById("panel-logros").style.display = "none";
      document.getElementById("menu").style.display = "block";
      if (window.Logros && Logros.limpiarDetalle) Logros.limpiarDetalle("logro-detalle");
    }

    function iniciarNoche(num) {
      FnatSesion.desactivarDificil();
      if (num === 1) FnatSesion.ir("video_intro.html");
      else if (num === 2) FnatSesion.ir("video_intro_noche2.html");
    }

    // musica de fondo en bucle
    var musica = new Audio("assets/musica/musica-inicio.mp4");
    musica.volume = 0.5;
    musica.play().catch(function () { });
    musica.addEventListener("ended", function () {
      musica.currentTime = 0;
      musica.play().catch(function () { });
    });
  </script>

</body>

</html>
