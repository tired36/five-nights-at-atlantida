<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>Five Nights at Atlantida</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      overflow: hidden;
      background: black;
      font-family: monospace;
      color: white;
    }

    #fondo-glitch,
    #fondo-normal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* fondo-glitch va detras del normal. ocultar el normal = mostrar el gif */
    #fondo-normal {
      z-index: 2;
    }

    #fondo-glitch {
      z-index: 1;
    }

    #overlay {
      position: fixed;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      z-index: 3;
    }

    #menu {
      position: absolute;
      top: 30%;
      left: 5%;
      z-index: 4;
    }

    #menu h1 {
      font-size: 50px;
      margin-bottom: 20px;
    }

    #menu button {
      display: block;
      background: transparent;
      border: none;
      color: white;
      font-size: 24px;
      margin: 10px 0;
      cursor: pointer;
    }

    #menu button:hover {
      color: red;
    }

    #panel-noches {
      display: none;
      position: absolute;
      top: 30%;
      left: 5%;
      z-index: 5;
      text-align: center;
      background: rgba(10, 0, 0, 0.85);
      border: 2px solid white;
      padding: 40px;
      min-width: 400px;
    }

    #panel-noches h2 {
      font-size: 35px;
      margin-bottom: 30px;
      letter-spacing: 2px;
    }

    .boton-noche {
      display: block;
      width: 100%;
      background: transparent;
      border: 1px solid white;
      color: white;
      font-size: 24px;
      margin: 15px 0;
      padding: 10px;
      cursor: pointer;
      font-family: monospace;
      transition: all 0.3s;
    }

    .boton-noche:hover:not(:disabled) {
      background: #ff0000;
      color: black;
      font-weight: bold;
    }

    .boton-noche:disabled {
      color: #666;
      border-color: #333;
      cursor: not-allowed;
    }

    .btn-volver {
      margin-top: 30px;
      font-size: 18px;
      border: none;
      background: none;
      color: #aaa;
      cursor: pointer;
      font-family: monospace;
    }

    .btn-volver:hover {
      color: white;
      text-decoration: underline;
    }

    #panel-logros {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #000;
      z-index: 20;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: monospace;
      user-select: none;
    }

    .logros-titulo {
      color: #cc0000;
      font-size: 2.5rem;
      text-transform: uppercase;
      letter-spacing: 5px;
      text-shadow: 2px 2px 20px #ff0000;
      margin-bottom: 50px;
    }

    .logros-lista {
      list-style: none;
      padding: 0;
      margin: 0 0 50px;
      width: 100%;
      max-width: 700px;
    }

    .logro-item {
      display: flex;
      align-items: center;
      gap: 20px;
      font-size: 1.4rem;
      text-transform: uppercase;
      letter-spacing: 3px;
      padding: 18px 24px;
      margin: 12px 0;
      border: 1px solid #330000;
      transition: opacity 1.5s, color 1.5s, text-shadow 1.5s, border-color 1.5s;
    }

    .logro-icono {
      width: 52px;
      height: 52px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #333;
      background: rgba(20, 0, 0, 0.5);
      position: relative;
    }

    .logro-icono svg {
      width: 26px;
      height: 26px;
      fill: currentColor;
    }

    .logro-texto {
      flex: 1;
      text-align: left;
    }

    .logro-item.desbloqueado .logro-icono {
      color: #cc0000;
      border-color: #cc0000;
      box-shadow: 0 0 12px rgba(255, 0, 0, 0.35);
    }

    .logro-item.desbloqueado .logro-texto {
      color: #cc0000;
      text-shadow: 2px 2px 20px #ff0000;
    }

    .logro-item.desbloqueado {
      border-color: #cc0000;
    }

    .logro-item.bloqueado .logro-icono {
      color: #444;
      border-color: #2a2a2a;
    }

    .logro-item.bloqueado .logro-texto {
      color: #333;
      text-shadow: none;
    }

    .logro-item.bloqueado {
      border-color: #222;
    }

    .btn-volver-logros {
      background: transparent;
      border: none;
      color: #666;
      font-family: monospace;
      font-size: 1rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      cursor: pointer;
      transition: color 0.3s;
    }

    .btn-volver-logros:hover {
      color: #cc0000;
      text-shadow: 0 0 10px #ff0000;
    }

  </style>
</head>

<body>

  <img src="assets/imagenes/menu/glitch.gif" id="fondo-glitch">
  <img src="assets/imagenes/menu/menu_german.png" id="fondo-normal">

  <div id="overlay"></div>

  <div id="menu">
    <h1>Five Nights at Atlantida</h1>
    <button onclick="nuevaPartida()">&#9658; NUEVA PARTIDA</button>
    <button onclick="continuar()">CONTINUAR</button>
    <button onclick="opciones()">OPCIONES</button>
    <button onclick="location.href='ranking.html'">RANKING</button>
    <button onclick="mostrarLogros()">LOGROS</button>
  </div>

  <div id="panel-logros">
    <h2 class="logros-titulo">Logros</h2>
    <ul class="logros-lista" id="logros-lista"></ul>
    <button class="btn-volver-logros" onclick="volverMenuLogros()">[ Volver al menu ]</button>
  </div>

  <div id="panel-noches">
    <h2>SELECCIONAR NOCHE</h2>
    <button class="boton-noche" onclick="iniciarNoche(1)">&#9658; NOCHE 1</button>
    <button class="boton-noche" onclick="iniciarNoche(2)">&#9658; NOCHE 2</button>
    <button class="boton-noche" onclick="mostrarPopupDesarrollo()">&#9658; NOCHE 3</button>
    <button class="btn-volver" onclick="volverMenu()">[ Volver al menu ]</button>
  </div>

  <div id="popup-desarrollo"
    style="display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 10; text-align: center; background: rgba(10,0,0,0.95); border: 2px solid red; padding: 40px; min-width: 300px; box-shadow: 0 0 15px red;">
    <h2 style="font-size: 30px; margin-bottom: 20px; color: red; letter-spacing: 2px;">EN DESARROLLO</h2>
    <p style="margin-bottom: 30px;">esta noche aun no esta disponible.</p>
    <button class="btn-volver" onclick="cerrarPopupDesarrollo()">[ Cerrar ]</button>
  </div>

  <script src="js/logros.js"></script>
  <script>
    var fondoNormal = document.getElementById("fondo-normal");
    var esAlonso = false;

    // glitch rapido: parpadeo corto cada 200ms con 30% de probabilidad
    setInterval(function () {
      if (Math.random() < 0.3) {
        fondoNormal.style.display = "none";
        setTimeout(function () { fondoNormal.style.display = "block"; }, 100);
      }
    }, 200);

    // cada 13 segundos cambia el personaje del fondo aprovechando el glitch
    setInterval(function () {
      fondoNormal.style.display = "none";
      setTimeout(function () {
        fondoNormal.src = esAlonso
          ? "assets/imagenes/menu/menu_german.png"
          : "assets/imagenes/menu/menu_alonso.jpg";
        esAlonso = !esAlonso;
        fondoNormal.style.display = "block";
      }, 150);
    }, 13000);

    function nuevaPartida() {
      document.getElementById("menu").style.display = "none";
      document.getElementById("panel-noches").style.display = "block";
    }

    function volverMenu() {
      document.getElementById("panel-noches").style.display = "none";
      document.getElementById("menu").style.display = "block";
    }

    function mostrarLogros() {
      document.getElementById("menu").style.display = "none";
      document.getElementById("panel-logros").style.display = "flex";
      renderLogros();
    }

    function renderLogros() {
      Logros.renderLista("logros-lista");
    }

    Logros.initEsquina();

    function volverMenuLogros() {
      document.getElementById("panel-logros").style.display = "none";
      document.getElementById("menu").style.display = "block";
    }

    function iniciarNoche(num) {
      if (num === 1) window.location.href = "video_intro.html";
      else if (num === 2) window.location.href = "video_intro_noche2.html";
      else alert("Iniciando Noche " + num + "...");
    }

    function mostrarPopupDesarrollo() {
      document.getElementById("popup-desarrollo").style.display = "block";
    }

    function cerrarPopupDesarrollo() {
      document.getElementById("popup-desarrollo").style.display = "none";
    }

    function continuar() { alert("continuando la partida"); }
    function opciones() { alert("cargando opciones"); }

    // musica de fondo en bucle
    var musica = new Audio("assets/musica/musica-inicio.mp4");
    musica.volume = 0.5;
    musica.play().catch(function () { });
    musica.addEventListener("ended", function () {
      musica.currentTime = 0;
      musica.play().catch(function () { });
    });
  </script>

</body>

</html>
