<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>Normas - Noche 1</title>
  <style>
    body {
      margin: 0;
      background: black url('assets/imagenes/escenarios/sala_principal/oficina.png') center/cover no-repeat fixed;
      color: white;
      font-family: monospace;
      text-align: center;
      padding-top: 50px;
      animation: fadeIn 2s;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    .lore-container {
      max-width: 800px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 30px;
      padding-bottom: 50px;
    }

    .lore-image {
      max-width: 100%;
      border: 2px solid white;
    }

    button {
      padding: 15px 30px;
      font-size: 22px;
      background: transparent;
      color: white;
      border: 2px solid white;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 2px;
      transition: all 0.3s;
    }

    button:hover {
      background: white;
      color: black;
    }
  </style>
</head>

<body>

  <div class="lore-container">
    <h2>NORMAS DE SEGURIDAD</h2>
    <img src="assets/imagenes/lore/NORMAS_1.jpg" alt="normas del juego" class="lore-image">
    <p id="aviso-dificil-normas" style="display:none;max-width:600px;color:#f88;font-size:14px;line-height:1.4;margin:0 auto 20px;"></p>
    <button onclick="FnatSesion.ir('juego_noche1.html')">AVANZAR</button>
  </div>

  <script src="js/fnat-sesion.js"></script>
  <script>
    if (FnatSesion.esDificil()) {
      var av = document.getElementById("aviso-dificil-normas");
      av.style.display = "block";
      av.textContent = "MODO DIFÍCIL. Casi imposible.";
    }
    // musica de tension en bucle (se mantiene la misma para continuidad)
    var musica = new Audio("assets/musica/tension_carta.mp3");
    musica.volume = 0.5;
    musica.play().catch(function () { });
    musica.addEventListener("ended", function () {
      musica.currentTime = 0;
      musica.play().catch(function () { });
    });
  </script>

</body>

</html>
