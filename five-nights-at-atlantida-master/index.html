<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Five Nights at Atlantida</title>
  <style>

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      overflow: hidden;
      background: black;
      font-family: monospace;
      color: white;
    }

    #fondo-glitch,
    #fondo-normal {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
    }

    #fondo-normal { z-index: 2; } /* encima */
    #fondo-glitch  { z-index: 1; } /* debajo */

    #overlay { /* capa negra semitransparente para oscurecer */
      position: fixed;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.5);
      z-index: 3;
    }

    #menu { /* posicion del menu en pantalla */
      position: absolute;
      top: 30%; left: 5%;
      z-index: 4;
    }

    #menu h1 {
      font-size: 50px;
      margin-bottom: 20px;
    }

    #menu button {
      display: block;
      background: transparent;
      border: none;
      color: white;
      font-size: 24px;
      margin: 10px 0;
      cursor: pointer;
    }

    #menu button:hover {
      color: red;
    }

  </style>
</head>
<body>

  <img src="assets/imagenes/menu/YSBwR6.gif" id="fondo-glitch" />
  <img src="assets/imagenes/menu/menu con german sin efecto glicth.png" id="fondo-normal" />

  <div id="overlay"></div>

  <div id="menu">
    <h1>Five Nights at Atlantida</h1>
    <button onclick="nuevaPartida()">▶ NUEVA PARTIDA</button>
    <button onclick="continuar()">CONTINUAR</button>
    <button onclick="opciones()">OPCIONES</button>
  </div>

  <script>

    var fondoNormal = document.getElementById("fondo-normal"); // imagen de encima

    setInterval(function () { // se repite cada 200ms

      if (Math.random() < 0.3) { // 30% de probabilidad de glitch
        fondoNormal.style.display = "none"; // oculta la imagen -> se ve el gif
        setTimeout(function () {
          fondoNormal.style.display = "block"; // la vuelve a mostrar
        }, 100);
      }

    }, 200);


    function nuevaPartida() {
      alert("iniciando nueva partida");
    }

    function continuar() {
      alert("continuando la partida");
    }

    function opciones() {
      alert("cargando opciones");
    }

  </script>

</body>
</html>
